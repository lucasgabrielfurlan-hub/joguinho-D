<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ Corrida 3D - Aventura Sem Fim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 4/3;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 18px;
            font-weight: bold;
        }

        #hud .speed {
            color: #ff6b35;
            font-size: 32px;
            margin-bottom: 5px;
        }

        #hud .distance {
            color: #4ecdc4;
        }

        #hud .scenario {
            color: #ffe66d;
            font-size: 14px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        #controls kbd {
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            margin: 0 2px;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: all;
            cursor: pointer;
        }

        #startScreen h1 {
            color: #ff6b35;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,107,53,0.5);
            animation: pulse 2s infinite;
        }

        #startScreen p {
            color: #fff;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        #startScreen .scenarios {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #startScreen .scenario-badge {
            background: rgba(255,255,255,0.1);
            border: 2px solid;
            padding: 10px 20px;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
        }

        #startScreen .scenario-badge.city { border-color: #ff6b35; color: #ff6b35; }
        #startScreen .scenario-badge.beach { border-color: #4ecdc4; color: #4ecdc4; }
        #startScreen .scenario-badge.rural { border-color: #95e1d3; color: #95e1d3; }
        #startScreen .scenario-badge.desert { border-color: #ffe66d; color: #ffe66d; }

        #startScreen .start-btn {
            background: #ff6b35;
            color: #fff;
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #lives {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            pointer-events: all;
        }

        #gameOver h2 {
            color: #ff6b35;
            font-size: 42px;
            margin-bottom: 20px;
        }

        #gameOver p {
            color: #fff;
            font-size: 20px;
            margin-bottom: 30px;
        }

        #gameOver button {
            background: #4ecdc4;
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .heart {
            display: inline-block;
            margin: 0 3px;
        }

        .heart.lost {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        @media (max-width: 768px) {
            #gameContainer {
                aspect-ratio: 3/4;
            }
            #startScreen h1 { font-size: 32px; }
            #hud { font-size: 14px; }
            #hud .speed { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="hud">
                <div class="speed" id="speedDisplay">0 km/h</div>
                <div class="distance" id="distDisplay">Distância: 0m</div>
                <div class="scenario" id="scenarioDisplay">🌆 Cidade ao Pôr do Sol</div>
            </div>
            
            <div id="lives">
                <span class="heart" id="heart1">❤️</span>
                <span class="heart" id="heart2">❤️</span>
                <span class="heart" id="heart3">❤️</span>
            </div>
            
            <div id="controls">
                <kbd>←</kbd> <kbd>→</kbd> Direção | <kbd>↑</kbd> Acelerar | <kbd>↓</kbd> Frear
            </div>
        </div>

        <div id="startScreen">
            <h1>🏎️ Corrida 3D</h1>
            <p>Atravesse múltiplos cenários em uma aventura sem fim!<br>
            Cuidado com os carros e obstáculos na estrada!</p>
            <div class="scenarios">
                <span class="scenario-badge city">🌆 Cidade</span>
                <span class="scenario-badge beach">🏖️ Praia</span>
                <span class="scenario-badge rural">🌾 Rural</span>
                <span class="scenario-badge desert">🏜️ Deserto</span>
            </div>
            <button class="start-btn" onclick="startGame()">JOGAR</button>
        </div>

        <div id="gameOver">
            <h2>💥 Fim de Jogo!</h2>
            <p id="finalScore">Você percorreu 0m</p>
            <button onclick="restartGame()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Configurações do jogo
        const GAME_WIDTH = 1024;
        const GAME_HEIGHT = 768;
        const FPS = 60;
        const STEP = 1 / FPS;
        
        // Segmentos da estrada
        const SEGMENT_LENGTH = 200;
        const RUMBLE_LENGTH = 3;
        const ROAD_WIDTH = 2000;
        const LANES = 3;
        const FIELD_OF_VIEW = 100;
        const CAMERA_HEIGHT = 1000;
        const CAMERA_DEPTH = 0.8;
        const DRAW_DISTANCE = 300;
        const MAX_SPEED = SEGMENT_LENGTH / STEP;
        const ACCEL = MAX_SPEED / 5;
        const BREAKING = -MAX_SPEED;
        const DECEL = -MAX_SPEED / 5;
        const OFF_ROAD_DECEL = -MAX_SPEED / 2;
        const OFF_ROAD_LIMIT = MAX_SPEED / 4;
        
        // Variáveis do jogo
        let position = 0;
        let speed = 0;
        let playerX = 0;
        let lives = 3;
        let distance = 0;
        let running = false;
        let segments = [];
        let cars = [];
        let particles = [];
        let scenario = 0; // 0=cidade, 1=praia, 2=rural, 3=deserto
        let scenarioTransition = 0;
        let lastTime = 0;
        
        // Cenários
        const SCENARIOS = [
            { name: '🌆 Cidade ao Pôr do Sol', sky: ['#1a0a2e', '#4a1a6e', '#ff6b35', '#f7b731'], ground: '#2d2d2d', road: '#333', rumble: '#ff6b35', lane: '#fff', tree: '#2d5016', building: '#4a4a6a', buildingWindow: '#f7b731' },
            { name: '🏖️ Praia Tropical', sky: ['#006ba6', '#0496ff', '#87ceeb', '#ffe66d'], ground: '#c2b280', road: '#555', rumble: '#ff6b35', lane: '#fff', tree: '#228b22', building: '#f4e4c1', buildingWindow: '#87ceeb' },
            { name: '🌾 Zona Rural', sky: ['#87ceeb', '#b0e0e6', '#98fb98', '#f0e68c'], ground: '#228b22', road: '#444', rumble: '#fff', lane: '#ffd700', tree: '#006400', building: '#8b4513', buildingWindow: '#deb887' },
            { name: '🏜️ Deserto', sky: ['#8b4513', '#cd853f', '#deb887', '#f4a460'], ground: '#d2b48c', road: '#666', rumble: '#fff', lane: '#ffd700', tree: '#556b2f', building: '#a0522d', buildingWindow: '#f4a460' }
        ];
        
        const SCENARIO_LENGTH = 10000; // metros por cenário
        
        // Teclas
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false
        };
        
        // Inicialização
        function init() {
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            
            createRoad();
            generateCars();
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') keys.left = true;
                if (e.key === 'ArrowRight') keys.right = true;
                if (e.key === 'ArrowUp') keys.up = true;
                if (e.key === 'ArrowDown') keys.down = true;
            });
            
            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft') keys.left = false;
                if (e.key === 'ArrowRight') keys.right = false;
                if (e.key === 'ArrowUp') keys.up = false;
                if (e.key === 'ArrowDown') keys.down = false;
            });
        }
        
        function createRoad() {
            segments = [];
            const totalLength = SCENARIO_LENGTH * SCENARIOS.length;
            const numSegments = Math.floor(totalLength / SEGMENT_LENGTH);
            
            for (let i = 0; i < numSegments; i++) {
                const curve = (i > 100 && i < 300) ? 2 : 
                             (i > 500 && i < 700) ? -2 : 
                             (i > 900 && i < 1100) ? 3 : 0;
                
                const hill = (i > 200 && i < 400) ? Math.sin(i * 0.02) * 1000 : 0;
                
                segments.push({
                    index: i,
                    p1: { world: { z: i * SEGMENT_LENGTH, y: hill, x: 0 }, camera: {}, screen: {} },
                    p2: { world: { z: (i + 1) * SEGMENT_LENGTH, y: hill + Math.sin((i+1) * 0.02) * 1000, x: 0 }, camera: {}, screen: {} },
                    curve: curve,
                    sprites: [],
                    cars: [],
                    color: Math.floor(i / RUMBLE_LENGTH) % 2 === 0 ? 'dark' : 'light'
                });
            }
            
            // Adicionar sprites (árvores, prédios)
            for (let i = 50; i < numSegments - 50; i += 3) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const offset = side * (1.5 + Math.random() * 2);
                const scenarioIdx = Math.floor((i * SEGMENT_LENGTH) / SCENARIO_LENGTH) % SCENARIOS.length;
                
                if (Math.random() > 0.3) {
                    // Árvore
                    segments[i].sprites.push({
                        type: 'tree',
                        offset: offset,
                        scenario: scenarioIdx
                    });
                } else if (scenarioIdx === 0 || scenarioIdx === 1) {
                    // Prédio (apenas cidade e praia)
                    segments[i].sprites.push({
                        type: 'building',
                        offset: offset,
                        height: 3000 + Math.random() * 4000,
                        width: 1500 + Math.random() * 1000,
                        scenario: scenarioIdx
                    });
                }
            }
        }
        
        function generateCars() {
            cars = [];
            for (let i = 0; i < 15; i++) {
                const segment = Math.floor(Math.random() * (segments.length - 200)) + 100;
                const lane = Math.floor(Math.random() * LANES) - 1;
                const offset = lane * 0.8;
                
                cars.push({
                    segment: segment,
                    offset: offset,
                    z: segment * SEGMENT_LENGTH,
                    speed: MAX_SPEED * (0.3 + Math.random() * 0.5),
                    sprite: ['🚗', '🚙', '🚕', '🏎️', '🚓'][Math.floor(Math.random() * 5)],
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`
                });
            }
        }
        
        function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
            p.camera.x = (p.world.x || 0) - cameraX;
            p.camera.y = (p.world.y || 0) - cameraY;
            p.camera.z = (p.world.z || 0) - cameraZ;
            
            const scale = cameraDepth / p.camera.z;
            
            p.screen.scale = scale;
            p.screen.x = Math.round((width / 2) + (scale * p.camera.x * width / 2));
            p.screen.y = Math.round((height / 2) - (scale * p.camera.y * height / 2));
            p.screen.w = Math.round((scale * roadWidth * width / 2));
        }
        
        function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.fill();
        }
        
        function drawSegment(ctx, width, height, lanes, segment, scenarioColors) {
            const x1 = segment.p1.screen.x;
            const y1 = segment.p1.screen.y;
            const w1 = segment.p1.screen.w;
            const x2 = segment.p2.screen.x;
            const y2 = segment.p2.screen.y;
            const w2 = segment.p2.screen.w;
            
            const r1 = w1 / Math.max(6, 2 * lanes);
            const r2 = w2 / Math.max(6, 2 * lanes);
            const l1 = w1 / Math.max(6, 2 * lanes);
            const l2 = w2 / Math.max(6, 2 * lanes);
            
            // Grama/terra
            ctx.fillStyle = scenarioColors.ground;
            ctx.fillRect(0, y2, width, y1 - y2);
            
            // Estrada
            drawPolygon(ctx, x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, scenarioColors.rumble);
            drawPolygon(ctx, x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, scenarioColors.rumble);
            drawPolygon(ctx, x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, scenarioColors.road);
            
            // Faixas centrais
            if (segment.color === 'light') {
                const laneW1 = w1 * 0.02;
                const laneW2 = w2 * 0.02;
                const laneX1 = x1 - w1 * 0.5;
                const laneX2 = x2 - w2 * 0.5;
                drawPolygon(ctx, laneX1 - laneW1, y1, laneX1 + laneW1, y1, laneX2 + laneW2, y2, laneX2 - laneW2, y2, scenarioColors.lane);
                
                const laneX1b = x1 + w1 * 0.5;
                const laneX2b = x2 + w2 * 0.5;
                drawPolygon(ctx, laneX1b - laneW1, y1, laneX1b + laneW1, y1, laneX2b + laneW2, y2, laneX2b - laneW2, y2, scenarioColors.lane);
            }
        }
        
        function drawSprite(ctx, width, height, resolution, roadWidth, sprite, scale, destX, destY, clipY) {
            const destW = (sprite.type === 'building' ? sprite.width : 1000) * scale * width / 2 * (1 / 800);
            const destH = (sprite.type === 'building' ? sprite.height : 1000) * scale * width / 2 * (1 / 800);
            
            const renderX = destX - destW / 2;
            const renderY = destY - destH;
            
            if (renderY < clipY) return;
            
            ctx.save();
            
            if (sprite.type === 'tree') {
                // Desenhar árvore
                const trunkW = destW * 0.2;
                const trunkH = destH * 0.4;
                
                // Tronco
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(renderX + destW/2 - trunkW/2, renderY + destH - trunkH, trunkW, trunkH);
                
                // Copa
                const foliageColors = ['#228B22', '#006400', '#2E8B57', '#3CB371'];
                const color = foliageColors[Math.floor(Math.random() * foliageColors.length)];
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(renderX + destW/2, renderY + destH * 0.5, destW * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(renderX + destW * 0.3, renderY + destH * 0.6, destW * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(renderX + destW * 0.7, renderY + destH * 0.6, destW * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
            } else if (sprite.type === 'building') {
                // Desenhar prédio
                ctx.fillStyle = SCENARIOS[sprite.scenario].building;
                ctx.fillRect(renderX, renderY, destW, destH);
                
                // Janelas
                ctx.fillStyle = SCENARIOS[sprite.scenario].buildingWindow;
                const windowSize = destW * 0.08;
                const windowGap = destW * 0.15;
                
                for (let wy = renderY + windowGap; wy < renderY + destH - windowGap; wy += windowGap * 2) {
                    for (let wx = renderX + windowGap; wx < renderX + destW - windowGap; wx += windowGap * 1.5) {
                        if (Math.random() > 0.3) {
                            ctx.fillRect(wx, wy, windowSize, windowSize * 1.5);
                        }
                    }
                }
                
                // Topo do prédio
                ctx.fillStyle = SCENARIOS[sprite.scenario].building;
                ctx.fillRect(renderX - destW * 0.05, renderY - destH * 0.05, destW * 1.1, destH * 0.05);
            }
            
            ctx.restore();
        }
        
        function drawCar(ctx, width, height, car, scale, destX, destY) {
            const destW = 800 * scale * width / 2 * (1 / 800);
            const destH = 500 * scale * width / 2 * (1 / 800);
            
            ctx.font = `${Math.round(destH)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(car.sprite, destX, destY);
        }
        
        function drawPlayer(ctx, width, height) {
            const scale = 0.3 * (width / 1024);
            const destX = width / 2;
            const destY = height - 50;
            const destW = 600 * scale;
            const destH = 400 * scale;
            
            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(destX, destY + 10, destW/2, destH/6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Carro do jogador
            ctx.font = `${Math.round(destH)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            
            // Inclinação baseada na direção
            ctx.save();
            ctx.translate(destX, destY);
            ctx.rotate(playerX * 0.05);
            ctx.fillText('🏎️', 0, 0);
            ctx.restore();
            
            // Luzes traseiras
            ctx.fillStyle = 'rgba(255, 50, 50, 0.8)';
            ctx.fillRect(destX - destW * 0.35, destY - destH * 0.3, destW * 0.1, destH * 0.15);
            ctx.fillRect(destX + destW * 0.25, destY - destH * 0.3, destW * 0.1, destH * 0.15);
        }
        
        function drawSky(ctx, width, height, scenarioIdx, transition) {
            const colors = SCENARIOS[scenarioIdx].sky;
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            
            for (let i = 0; i < colors.length; i++) {
                gradient.addColorStop(i / (colors.length - 1), colors[i]);
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Sol/Lua
            const sunY = height * 0.3 + Math.sin(Date.now() * 0.0005) * 50;
            const sunX = width * 0.7 + Math.cos(Date.now() * 0.0003) * 30;
            
            ctx.fillStyle = scenarioIdx === 0 ? '#ff6b35' : '#f7b731';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Brilho do sol
            const sunGlow = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 100);
            sunGlow.addColorStop(0, 'rgba(255, 107, 53, 0.3)');
            sunGlow.addColorStop(1, 'rgba(255, 107, 53, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 100, 0, Math.PI * 2);
            ctx.fill();
            
            // Nuvens
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 5; i++) {
                const cloudX = ((Date.now() * 0.02 + i * 200) % (width + 200)) - 100;
                const cloudY = 50 + i * 30 + Math.sin(i) * 20;
                ctx.beginPath();
                ctx.arc(cloudX, cloudY, 30, 0, Math.PI * 2);
                ctx.arc(cloudX + 25, cloudY - 10, 35, 0, Math.PI * 2);
                ctx.arc(cloudX + 50, cloudY, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawParticles(ctx) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.size *= 0.98;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function addParticle(x, y, r, g, b, speed) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * speed,
                    vy: (Math.random() - 0.5) * speed,
                    r: r,
                    g: g,
                    b: b,
                    life: 1,
                    size: 5 + Math.random() * 10
                });
            }
        }
        
        function update(dt) {
            // Controles
            if (keys.up) {
                speed += ACCEL * dt;
            } else if (keys.down) {
                speed += BREAKING * dt;
            } else {
                speed += DECEL * dt;
            }
            
            if (keys.left) playerX -= 2 * dt;
            if (keys.right) playerX += 2 * dt;
            
            // Limites
            if (speed > MAX_SPEED) speed = MAX_SPEED;
            if (speed < 0) speed = 0;
            if (playerX < -2) playerX = -2;
            if (playerX > 2) playerX = 2;
            
            // Posição
            position += speed * dt;
            distance = Math.floor(position / 100);
            
            // Cenário atual
            const newScenario = Math.floor(distance / (SCENARIO_LENGTH / 100)) % SCENARIOS.length;
            if (newScenario !== scenario) {
                scenario = newScenario;
                document.getElementById('scenarioDisplay').textContent = SCENARIOS[scenario].name;
            }
            
            // Atualizar carros
            for (let i = 0; i < cars.length; i++) {
                const car = cars[i];
                car.z += car.speed * dt;
                
                if (car.z > position + DRAW_DISTANCE * SEGMENT_LENGTH) {
                    car.z = position - 1000;
                    car.segment = Math.floor(car.z / SEGMENT_LENGTH);
                    car.offset = (Math.floor(Math.random() * LANES) - 1) * 0.8;
                }
                
                car.segment = Math.floor(car.z / SEGMENT_LENGTH);
                
                // Colisão
                const carSegment = car.segment;
                const playerSegment = Math.floor(position / SEGMENT_LENGTH);
                
                if (carSegment === playerSegment || carSegment === playerSegment + 1) {
                    const carWorldX = car.offset * ROAD_WIDTH;
                    const playerWorldX = playerX * ROAD_WIDTH;
                    
                    if (Math.abs(carWorldX - playerWorldX) < 800 && speed > car.speed) {
                        // Colisão!
                        speed *= 0.5;
                        lives--;
                        updateLives();
                        addParticle(GAME_WIDTH / 2, GAME_HEIGHT - 100, 255, 100, 0, 10);
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                }
            }
            
            // Partículas de velocidade
            if (speed > MAX_SPEED * 0.5 && Math.random() > 0.7) {
                addParticle(
                    GAME_WIDTH / 2 + (Math.random() - 0.5) * 50,
                    GAME_HEIGHT - 80,
                    200, 200, 255,
                    5
                );
            }
            
            // Atualizar HUD
            document.getElementById('speedDisplay').textContent = Math.floor(speed / 100) + ' km/h';
            document.getElementById('distDisplay').textContent = 'Distância: ' + distance + 'm';
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const baseSegment = Math.floor(position / SEGMENT_LENGTH);
            const basePercent = (position % SEGMENT_LENGTH) / SEGMENT_LENGTH;
            
            const playerSegment = segments[baseSegment % segments.length];
            const playerPercent = basePercent;
            
            const playerY = playerSegment.p1.world.y;
            
            const dx = -playerSegment.curve * playerPercent;
            const x = 0;
            const maxy = canvas.height;
            
            // Desenhar céu
            drawSky(ctx, canvas.width, canvas.height, scenario, scenarioTransition);
            
            // Projetar segmentos
            let camX = playerX * ROAD_WIDTH;
            let camY = CAMERA_HEIGHT + playerY;
            let camZ = position;
            
            const maxDrawDistance = Math.min(DRAW_DISTANCE, segments.length - baseSegment);
            
            for (let n = 0; n < maxDrawDistance; n++) {
                const segment = segments[(baseSegment + n) % segments.length];
                const looped = segment.index < baseSegment;
                const segmentZ = looped ? segment.p1.world.z + segments.length * SEGMENT_LENGTH : segment.p1.world.z;
                
                project(segment.p1, camX - x, camY, camZ - (looped ? segments.length * SEGMENT_LENGTH : 0), CAMERA_DEPTH, canvas.width, canvas.height, ROAD_WIDTH);
                project(segment.p2, camX - x - dx, camY, camZ - (looped ? segments.length * SEGMENT_LENGTH : 0), CAMERA_DEPTH, canvas.width, canvas.height, ROAD_WIDTH);
                
                x += dx;
                dx += segment.curve;
            }
            
            // Desenhar segmentos (de trás para frente)
            const scenarioColors = SCENARIOS[scenario];
            
            for (let n = maxDrawDistance - 1; n > 0; n--) {
                const segment = segments[(baseSegment + n) % segments.length];
                
                if (segment.p1.camera.z <= CAMERA_DEPTH || segment.p2.screen.y >= maxy || segment.p2.screen.y >= segment.p1.screen.y) continue;
                
                drawSegment(ctx, canvas.width, canvas.height, LANES, segment, scenarioColors);
                maxy = segment.p1.screen.y;
            }
            
            // Desenhar sprites (de trás para frente)
            for (let n = maxDrawDistance - 1; n > 0; n--) {
                const segment = segments[(baseSegment + n) % segments.length];
                
                for (let i = 0; i < segment.sprites.length; i++) {
                    const sprite = segment.sprites[i];
                    const spriteScale = segment.p1.screen.scale;
                    const spriteX = segment.p1.screen.x + (spriteScale * sprite.offset * ROAD_WIDTH * canvas.width / 2);
                    const spriteY = segment.p1.screen.y;
                    
                    drawSprite(ctx, canvas.width, canvas.height, 1, ROAD_WIDTH, sprite, spriteScale, spriteX, spriteY, -1);
                }
                
                // Desenhar carros
                for (let i = 0; i < cars.length; i++) {
                    const car = cars[i];
                    if (car.segment === segment.index) {
                        const carScale = segment.p1.screen.scale;
                        const carX = segment.p1.screen.x + (carScale * car.offset * ROAD_WIDTH * canvas.width / 2);
                        const carY = segment.p1.screen.y;
                        
                        drawCar(ctx, canvas.width, canvas.height, car, carScale, carX, carY);
                    }
                }
            }
            
            // Desenhar jogador
            drawPlayer(ctx, canvas.width, canvas.height);
            
            // Desenhar partículas
            drawParticles(ctx);
        }
        
        function gameLoop(timestamp) {
            if (!running) return;
            
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            
            update(dt);
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        function updateLives() {
            for (let i = 1; i <= 3; i++) {
                const heart = document.getElementById('heart' + i);
                if (i > lives) {
                    heart.classList.add('lost');
                } else {
                    heart.classList.remove('lost');
                }
            }
        }
        
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            running = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        function restartGame() {
            position = 0;
            speed = 0;
            playerX = 0;
            lives = 3;
            distance = 0;
            scenario = 0;
            particles = [];
            
            updateLives();
            document.getElementById('scenarioDisplay').textContent = SCENARIOS[0].name;
            document.getElementById('gameOver').style.display = 'none';
            
            createRoad();
            generateCars();
            
            running = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            running = false;
            document.getElementById('finalScore').textContent = 'Você percorreu ' + distance + 'm através de ' + (scenario + 1) + ' cenários!';
            document.getElementById('gameOver').style.display = 'flex';
        }
        
        // Inicializar
        init();
        
        // Redimensionar
        window.addEventListener('resize', () => {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        });
        
        // Trigger resize
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
